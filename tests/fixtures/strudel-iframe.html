<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strudel iframe Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 {
      text-align: center;
    }
    #strudelFrame {
      width: 100%;
      height: 80vh;
      border: 3px solid #444;
      border-radius: 8px;
      margin: 20px 0;
    }
    .info {
      background: #333;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Strudel iframe Integration Test</h1>
  
  <div class="info">
    <h2>Test Setup</h2>
    <p>This page embeds the full Strudel.cc website in an iframe.</p>
    <p>The MCP server should be able to:</p>
    <ul>
      <li>Access the iframe content</li>
      <li>Write patterns to the editor</li>
      <li>Control playback</li>
      <li>Read current patterns</li>
    </ul>
  </div>

  <iframe 
    id="strudelFrame" 
    src="https://strudel.cc/"
    allow="autoplay; microphone"
  ></iframe>

  <div class="info">
    <h3>Status</h3>
    <p id="status">Waiting for iframe to load...</p>
  </div>

  <script>
    const iframe = document.getElementById('strudelFrame');
    const status = document.getElementById('status');

    iframe.addEventListener('load', () => {
      status.textContent = 'Iframe loaded successfully! Ready for MCP automation.';
      console.log('Strudel iframe loaded');
    });

    iframe.addEventListener('error', (e) => {
      status.textContent = 'Error loading iframe: ' + e.message;
      console.error('Iframe error:', e);
    });
  </script>
</body>
</html>
