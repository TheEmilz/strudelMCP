services:
  strudel-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strudel-mcp-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - STRUDEL_HEADLESS=true
      - STRUDEL_PORT=3000
      - STRUDEL_TRANSPORT=http
      - STRUDEL_URL=https://strudel.cc/
    volumes:
      # Persist pattern storage
      - ./patterns:/app/patterns
    restart: unless-stopped
    # Share the host's network namespace for better browser performance (optional)
    # network_mode: host
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
